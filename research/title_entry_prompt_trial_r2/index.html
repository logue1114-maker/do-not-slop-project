<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게임 메인 화면 · 원본 비교 R2</title><style>*{box-sizing:border-box}body{margin:0;background:#ddd;color:#171717;font:16px/1.5 system-ui,sans-serif}header,footer{padding:12px 20px;max-width:1405px}h1{font-size:20px;display:inline;margin:0 20px 0 0}nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,a,select{font:inherit}button{padding:7px 15px;border:1px solid #777;color:#222;background:#fff;cursor:pointer}button[aria-pressed=true]{background:#222;color:#fff}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #1455c0;outline-offset:3px}select{padding:6px}a{color:#174ea6}#stage{width:1365px;height:768px;background:#111;margin:0 20px}iframe{width:100%;height:100%;border:0;display:block}iframe[hidden]{display:none}p{margin:6px 0}details{margin:14px 0}summary{cursor:pointer}footer a{margin-right:16px}.status{font-size:14px;color:#633d00}img{max-width:100%;height:auto}</style><header><nav aria-label="메인 화면 비교"><h1>게임 메인 화면 · R2</h1><button type="button" data-arm="delta" aria-pressed="true">A</button><button type="button" data-arm="echo" aria-pressed="false">B</button><label>화면 <select id="viewport"><option value="1365,768">PC 1365 × 768</option><option value="844,390">가로 844 × 390</option><option value="390,844">세로 390 × 844</option></select></label><a id="open" href="delta/" target="_blank" rel="noopener">선택한 원본만 열기</a><button type="button" id="reload">선택한 페이지 새로고침</button></nav><p class="status" id="qa-status">직접 화면·기본 진입 흐름 검수: 세로 가독성은 B가 낫지만, 전체 품질 우위는 단정하지 않았습니다</p></header><main id="stage"><iframe id="delta" title="메인 화면 원본 A" src="delta/"></iframe><iframe id="echo" title="메인 화면 원본 B" src="echo/" hidden></iframe></main><footer><p>같은 요청·모델·제작 상한·배경 이미지·폰트. 제작 완료 후 두 원본 모두 손보지 않았습니다</p><p><a href="captures/A-desktop-initial.jpg">A PC 실제 화면</a><a href="captures/B-desktop-initial.jpg">B PC 실제 화면</a><a href="captures/A-portrait-initial.jpg">A 세로 실제 화면</a><a href="captures/B-portrait-initial.jpg">B 세로 실제 화면</a></p><details><summary>입력과 조건 확인</summary><p>A는 일반 요청, B는 같은 요청에 전체 화면 지침과 실제 참고 화면을 추가한 결과입니다</p><a href="shared/brief.txt">공통 요청</a><a href="guidance.txt">추가 지침</a><a href="PROTOCOL.md">실험 조건</a><a href="RESULTS.md">실제 검수 결과</a></details></footer><script>const frames=[...document.querySelectorAll('iframe')],stage=document.querySelector('#stage'),select=document.querySelector('#viewport');let selected='delta';function resize(){const [w,h]=select.value.split(',').map(Number);stage.style.width=w+'px';stage.style.height=h+'px'}document.querySelectorAll('[data-arm]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.arm;frames.forEach(f=>f.hidden=f.id!==selected);document.querySelectorAll('[data-arm]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('#open').href=selected+'/'}));select.addEventListener('change',resize);document.querySelector('#reload').addEventListener('click',()=>{const f=document.getElementById(selected);f.src=f.getAttribute('src')});if(innerWidth<600){select.value='390,844';resize()}</script></html>

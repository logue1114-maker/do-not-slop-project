function routeHash(r){return '#'+r.id+'/'+r.view;}
function parseRoute(){const [id,view]=location.hash.slice(1).split('/');return configs[id]&&allowed[id].includes(view)?{id,view}:{id:'shopping',view:'list'};}
function normalize(r){const s=states[r.id];if(r.id==='shopping'&&r.view==='review'&&!s.cart.length)r.view='cart';if(r.id==='work'&&r.view==='edit'&&!s.draft)r.view='detail';if(r.id==='course'&&['practice','feedback'].includes(r.view)&&s.lesson===1)r.view='lesson';if(r.id==='course'&&r.view==='feedback'&&!s.feedback)r.view='practice';if(r.id==='course'&&r.view==='complete'&&!s.completed.every(Boolean))r.view='lesson';if(r.id==='booking'&&r.view!=='select'&&(!s.slot||!s.name.trim()))r.view='select';if(r.id==='booking'&&r.view==='confirmed'&&!s.confirmed)r.view='review';if(r.id==='booking'&&r.view==='conflict'&&!(s.stale&&s.slot==='14:00'&&s.service==='room'))r.view='review';return r;}
function dirty(){const c=states.community,w=states.work;return active==='community'&&['draft','preview'].includes(current.view)&&c.draft!==c.savedDraft||active==='work'&&current.view==='edit'&&w.draft&&JSON.stringify(w.draft)!==JSON.stringify(w.records.find(r=>r.id===w.selected));}
function discardCurrent(){if(active==='community'){states.community.draft=states.community.savedDraft;states.community.error='';}if(active==='work'){states.work.draft=null;states.work.error='';}}
function askGuard(title,copy,accept,callback){if(dialog.open)return;guardReturn=document.activeElement;document.querySelector('#guard-title').textContent=title;document.querySelector('#guard-copy').textContent=copy;document.querySelector('#guard-accept').textContent=accept;document.querySelector('#guard-stay').textContent=accept==='Reset example'?'Keep current state':'Keep editing';pending=callback;dialog.showModal();document.querySelector('#guard-stay').focus();}
function requestRoute(r,options={}){r=normalize({...r});const sameDraft=active===r.id&&active==='community'&&['draft','preview'].includes(r.view);if(dirty()&&!sameDraft&&routeHash(r)!==routeHash(current)){askGuard('Discard unsaved changes?','Your unsaved draft will be discarded. Saved fixture records stay unchanged.','Discard changes',accepted=>{if(accepted){discardCurrent();commitRoute(r,options)}else if(options.pop){history.pushState({},'',routeHash(current));}});return;}commitRoute(r,options);}
function commitRoute(r,options={}){active=r.id;current=r;states[active].view=r.view;if(options.pop){if(location.hash!==routeHash(r))history.replaceState({},'',routeHash(r));}else if(location.hash!==routeHash(r)){history[options.replace?'replaceState':'pushState']({},'',routeHash(r));}announce('');render(options.focus!==false);}
function go(view){requestRoute({id:active,view})}
function rerender(focusId){render(false);if(focusId)document.getElementById(focusId)?.focus();}
function render(moveFocus=true){const c=configs[active];screen.className='specimen '+active.replace('shopping','shop').replace('information','info');const roles={primary:c.primary,hover:c.hover,focus:c.focus,text:c.text,muted:c.muted,border:c.border,control:c.control,secondary:c.secondary,selection:c.selection,radius:c.radius,secondaryHover:'#f6f7f8',error:'#a12636',success:'#24633e',destructive:'#9b2837',disabledBg:'#f0f1f2',disabledText:'#666d75',disabledBorder:'#a7adb4'};Object.entries(roles).forEach(([k,v])=>screen.style.setProperty('--'+k,v));screen.innerHTML=renderers[active]();document.querySelectorAll('#gallery-nav button').forEach(el=>{if(el.dataset.example===active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});document.querySelector('#example-select').value=active;document.title=c.name+' flow · Do Not Slop Project';document.querySelector('#settings-content').innerHTML=`<p><strong>Intent:</strong> ${c.intent}</p><p><strong>Main path:</strong> ${c.path}</p><p><strong>Layout:</strong> ${c.layout}</p><div class="swatches">${['primary','text','focus','selection'].map(role=>`<span class="swatch"><i style="background:${c[role]}" aria-hidden="true"></i>${role} <span class="mono">${c[role]}</span></span>`).join('')}</div><p><strong>Use limits:</strong> ${c.inappropriate}</p><p>Dimensions are example-specific proposals. Full roles, routes, state fixtures and review gates are in <a href="presets.json" download>presets.json</a>.</p>`;if(moveFocus){document.getElementById('view-title')?.focus();window.scrollTo(0,0);}}
document.querySelector('#gallery-nav').innerHTML=Object.entries(configs).map(([id,c])=>`<button data-example="${id}">${c.name}</button>`).join('');
document.querySelector('#example-select').innerHTML=Object.entries(configs).map(([id,c])=>`<option value="${id}">${c.name}</option>`).join('');
document.querySelector('#gallery-nav').addEventListener('click',e=>{const id=e.target.closest('[data-example]')?.dataset.example;if(id)requestRoute({id,view:states[id].view});});
document.querySelector('#example-select').addEventListener('change',e=>{const id=e.target.value;e.target.value=active;requestRoute({id,view:states[id].view});});
document.querySelector('#reset').addEventListener('click',()=>askGuard('Reset '+configs[active].name.toLowerCase()+' example?','Clear this example’s local changes, selections and outcomes. Restore the original fixture. Other examples stay unchanged.','Reset example',accepted=>{if(accepted){states[active]=emptyState(active);commitRoute({id:active,view:defaults[active]},{replace:true});document.querySelector('#settings').open=false;announce('Example reset. Original fixture restored.');}}));
function closeGuard(accepted){const callback=pending;pending=null;dialog.close();guardReturn?.focus();callback?.(accepted);}
document.querySelector('#guard-stay').addEventListener('click',()=>closeGuard(false));document.querySelector('#guard-accept').addEventListener('click',()=>closeGuard(true));dialog.addEventListener('cancel',e=>{e.preventDefault();closeGuard(false)});
window.addEventListener('popstate',()=>requestRoute(parseRoute(),{pop:true}));
window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue='';}});
screen.addEventListener('click',e=>{const section=e.target.closest('[data-section]');if(section){e.preventDefault();const target=document.getElementById(section.dataset.section);target?.scrollIntoView();target?.focus();return;}const el=e.target.closest('[data-action]');if(!el||el.disabled)return;e.preventDefault();const [action,...args]=el.dataset.action.split(':');const s=states[active];
if(action==='shop-list')go('list');else if(action==='shop-cart')go('cart');else if(action==='shop-product'){s.product=args[0];go('product')}else if(action==='shop-variant'){s.variants[s.product]=args[0];rerender();screen.querySelector(`[data-action="shop-variant:${args[0]}"]`)?.focus();}
else if(action==='shop-add'){const p=fixture.shopping.products.find(p=>p.id===s.product),v=s.variants[p.id];let item=s.cart.find(x=>x.id===p.id&&x.variant===v);if(item&&item.qty>=p.maxQuantity){announce('Maximum 5 per finish. Cart unchanged.');return;}if(item)item.qty++;else s.cart.push({id:p.id,variant:v,qty:1});s.reviewed=false;rerender();screen.querySelector('[data-action="shop-add"]')?.focus();announce(`${p.name} · ${v} added. Cart has ${s.cart.reduce((n,x)=>n+x.qty,0)} items.`);}
else if(action==='shop-qty'){const i=+args[0],x=s.cart[i];if(!x)return;x.qty=Math.max(1,Math.min(5,x.qty+(+args[1])));s.reviewed=false;rerender();screen.querySelector(`[data-action="shop-qty:${i}:${args[1]}"]:not(:disabled)`)?.focus();announce('Quantity changed. Costs updated.');}
else if(action==='shop-remove'){s.removed=structuredClone(s.cart[+args[0]]);s.cart.splice(+args[0],1);s.reviewed=false;rerender();screen.querySelector('[data-action="shop-undo"]')?.focus();announce('Item removed. Undo is available.');}else if(action==='shop-undo'&&s.removed){const old=s.cart.find(x=>x.id===s.removed.id&&x.variant===s.removed.variant);if(old)old.qty=Math.min(5,old.qty+s.removed.qty);else s.cart.push(s.removed);s.removed=null;s.reviewed=false;rerender();announce('Last removed item restored.');}else if(action==='shop-review'&&s.cart.length)go('review');else if(action==='shop-finish'&&!s.reviewed){s.reviewed=true;rerender();announce('Item review completed locally. No order sent.');}
else if(action==='info-article'){s.resultY=window.scrollY;s.resultFocus='result-'+args[0];s.article=args[0];go('article');}else if(action==='info-back'){go('results');window.scrollTo(0,s.resultY);document.getElementById(s.resultFocus)?.focus({preventScroll:true});}else if(action==='info-clear'){s.query='';s.category='All';rerender('query');announce('Search and topic filter cleared.');}
else if(action==='course-practice')go('practice');else if(action==='course-lesson')go('lesson');else if(action==='course-feedback'&&s.feedback)go('feedback');else if(action==='course-retry'){s.answer=null;s.feedback=null;go('practice');}else if(action==='course-continue'&&s.feedback==='correct'){s.completed[0]=true;s.lesson=1;s.answer=null;s.feedback=null;go('lesson');announce('Lesson 1 completed. Lesson 2 opened.');}else if(action==='course-finish'&&s.lesson===1){s.completed[1]=true;go('complete');}else if(action==='course-open'){const i=+args[0];if(i===1&&!s.completed[0])return;if(i!==s.lesson){s.answer=null;s.feedback=null;}s.lesson=i;go('lesson');}
else if(action==='forum-filter'){s.filter=args[0];rerender();screen.querySelector(`[data-action="forum-filter:${args[0]}"]`)?.focus();}else if(action==='forum-thread'){s.thread=args[0];go('thread');}else if(action==='forum-list')go('list');else if(action==='forum-draft'){s.draft=s.savedDraft;s.error='';go('draft');document.getElementById('reply')?.focus();}else if(action==='forum-edit')go('draft');else if(action==='forum-cancel'){if(s.draft!==s.savedDraft)askGuard('Discard this draft?','Unsaved reply changes will be discarded. Your earlier local draft, if any, is retained. Nothing has been posted.','Discard changes',yes=>{if(yes){s.draft=s.savedDraft;s.error='';go('thread')}});else go('thread');}else if(action==='forum-keep'){s.savedDraft=s.draft;go('thread');announce('Private draft kept in this tab. Nothing posted.');}
else if(action==='work-list')go('list');else if(action==='work-detail'){s.selected=args[0];go('detail');}else if(action==='work-all'){s.filter='All';rerender();announce('Showing all tasks.');}else if(action==='work-edit'){s.draft=structuredClone(s.records.find(r=>r.id===s.selected));s.error='';go('edit');document.getElementById('task-title')?.focus();}else if(action==='work-cancel'){s.draft=null;s.error='';go('detail');announce('Edit canceled. Saved record unchanged.');}
else if(action==='booking-date'){if(s.date!==args[0]){s.date=args[0];s.slot=null;s.confirmed=false;s.error='';}rerender();screen.querySelector(`[data-action="booking-date:${args[0]}"]`)?.focus();}else if(action==='booking-slot'){if(s.stale&&s.service==='room'&&args[0]==='14:00')return;s.slot=args[0];s.confirmed=false;s.error='';rerender();screen.querySelector(`[data-action="booking-slot:${args[0]}"]`)?.focus();}else if(action==='booking-next'){s.date='2026-10-15';s.slot=null;rerender();screen.querySelector('[data-action="booking-slot:15:00"]')?.focus();announce('October 15 opened. Choose an available time.');}else if(action==='booking-back')go('select');else if(action==='booking-confirm'&&!s.confirmed){if(s.service==='room'&&s.slot==='14:00'){s.stale=true;go('conflict');}else{s.confirmed=true;go('confirmed');announce('Confirmed locally. No booking sent or payment made.');}}else if(action==='booking-recover'){s.slot='15:00';s.confirmed=false;go('review');announce('15:00 selected. Review before confirming.');}
});
screen.addEventListener('input',e=>{const s=states[active],el=e.target;if(active==='community'&&el.id==='reply'){s.draft=el.value;s.error='';}else if(active==='work'&&s.draft&&['title','notes'].includes(el.name)){s.draft[el.name]=el.value;}else if(active==='booking'&&['name','people'].includes(el.name)){s[el.name]=el.value;s.confirmed=false;}});
screen.addEventListener('change',e=>{const s=states[active],el=e.target;if(active==='course'&&el.name==='answer'){s.answer=+el.value;document.querySelector('#check-answer').disabled=false;}else if(active==='work'&&el.id==='work-filter'){s.filter=el.value;rerender('work-filter');announce('Task status filter applied.');}else if(active==='work'&&s.draft&&['owner','status'].includes(el.name)){s.draft[el.name]=el.value;}else if(active==='booking'&&el.name==='service'){s.service=el.value;s.slot=null;s.confirmed=false;s.error='';rerender();screen.querySelector(`[name="service"][value="${s.service}"]`)?.focus();announce('Space changed. Choose a time; meeting details retained.');}});
screen.addEventListener('toggle',e=>{if(e.target.id==='course-outline')states.course.outline=e.target.open;},true);
screen.addEventListener('submit',e=>{e.preventDefault();const s=states[active],data=new FormData(e.target);if(e.target.id==='search-form'){s.query=String(data.get('query'));s.category=String(data.get('category'));s.resultY=0;s.resultFocus=null;rerender('query');announce('Search updated.');}
else if(e.target.id==='practice-form'&&s.view==='practice'&&s.answer!==null){s.attempts++;s.feedback=s.answer===fixture.course.lessons[0].correct?'correct':'incorrect';go('feedback');}
else if(e.target.id==='draft-form'){s.draft=String(data.get('reply'));if(!s.draft.trim()){s.error='Enter a reply before previewing.';rerender('reply');return;}if(s.draft.length>600){s.error='Keep the reply within 600 characters.';rerender('reply');return;}s.error='';go('preview');}
else if(e.target.id==='work-form'&&s.draft){s.draft.title=String(data.get('title'));s.draft.notes=String(data.get('notes'));s.draft.owner=String(data.get('owner'));s.draft.status=String(data.get('status'));if(!s.draft.title.trim()){s.error='Enter a task title.';rerender('task-title');return;}s.draft.title=s.draft.title.trim();s.records[s.records.findIndex(r=>r.id===s.selected)]=structuredClone(s.draft);s.draft=null;s.error='';go('detail');announce('Task saved locally. Other records unchanged.');}
else if(e.target.id==='booking-form'){s.name=String(data.get('name'));s.people=String(data.get('people'));const capacity=bookingService().capacity;if(!s.name.trim())s.error='Enter a meeting name.';else if(!/^\d+$/.test(s.people)||+s.people<1||+s.people>capacity)s.error=`Enter people from 1 to ${capacity}.`;else if(!s.slot||s.date==='2026-10-16')s.error='Choose an available time.';else s.error='';if(s.error){rerender();screen.querySelector(s.error.startsWith('Enter people')?'[name="people"]':'[name="name"]')?.focus();return;}go('review');}});
screen.addEventListener('keydown',e=>{if(e.key==='Escape'&&active==='work'&&states.work.view==='edit'){e.preventDefault();states.work.draft=null;states.work.error='';go('detail');announce('Edit canceled. Saved record unchanged.');}});
const initial=normalize(parseRoute());commitRoute(initial,{replace:true,focus:false});
window.flowDemo={fixture,configs,getSnapshot:()=>structuredClone({active,current,states}),resetAll:()=>{states=Object.fromEntries(Object.keys(configs).map(id=>[id,emptyState(id)]));commitRoute({id:'shopping',view:'list'},{replace:true});}};
</script>
</body>

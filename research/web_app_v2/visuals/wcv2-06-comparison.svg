<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790" viewBox="0 0 1600 790" role="img"><title>WCV2-06 설명을 결과에 붙이고 선택 조건은 가까이 남긴다</title><rect width="1600" height="790" fill="#EEF1F4"/><g font-family="Noto Sans CJK KR,sans-serif" fill="#17212B"><text x="24" y="44" font-size="25" font-weight="700">WCV2-06 설명을 결과에 붙이고 선택 조건은 가까이 남긴다</text><text x="24" y="76" font-size="18">같은 콘텐츠 · 같은 상태 · 1024×720 시안</text><text x="24" y="114" font-size="19" font-weight="700">수정 전</text><text x="816" y="114" font-size="19" font-weight="700">수정 후</text></g><g transform="translate(24,130) scale(.75)"><rect width="1024" height="720" fill="#FFFFFF"/><rect x="0" y="0" width="1024" height="64" rx="0" fill="#F5F7F9"/><text id="t1" x="32" y="41" font-family="Noto Sans CJK KR, sans-serif" font-size="20" font-weight="700" fill="#18202A">지역 서비스 찾기</text><text id="t2" x="895" y="40" font-family="Noto Sans CJK KR, sans-serif" font-size="16" font-weight="400" fill="#18202A">도움</text><path d="M0,64 H1024" stroke="#D5DDE4"/><text id="t4" x="32" y="105" font-family="Noto Sans CJK KR, sans-serif" font-size="30" font-weight="700" fill="#18202A">가까운 공공시설과 프로그램</text><rect x="32" y="125" width="772" height="44" rx="5" fill="#FFFFFF" stroke="#D5DDE4"/><text id="t6" x="48" y="155" font-family="Noto Sans CJK KR, sans-serif" font-size="18" font-weight="400" fill="#18202A">예시 지역 A</text><rect x="820" y="125" width="172" height="44" rx="6" fill="#145B8D"/><text id="t8" x="836" y="154.0" font-family="Noto Sans CJK KR, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">검색</text><text id="t9" x="32" y="199" font-family="Noto Sans CJK KR, sans-serif" font-size="16" font-weight="400" fill="#505C69">일부 지역은 목록이 없으며, 주민만 이용할 수 있는 프로그램이 있습니다.</text><rect x="32" y="219" width="960" height="118" rx="6" fill="#F1F4F7"/><text id="t11" x="52" y="250" font-family="Noto Sans CJK KR, sans-serif" font-size="16" font-weight="400" fill="#18202A">시설은 이용할 수 있는 공간과 담당 안내를 제공합니다.</text><text id="t12" x="52" y="279" font-family="Noto Sans CJK KR, sans-serif" font-size="16" font-weight="400" fill="#18202A">프로그램은 정해진 시간에 참여하는 활동입니다.</text><text id="t13" x="52" y="309" font-family="Noto Sans CJK KR, sans-serif" font-size="16" font-weight="400" fill="#505C69">아래 결과를 선택하면 세부 정보를 확인할 수 있습니다</text><rect x="32" y="341" width="224" height="358" rx="6" fill="#F8FAFC" stroke="#D5DDE4"/><text id="t15" x="48" y="377" font-family="Noto Sans CJK KR, sans-serif" font-size="20" font-weight="600" fill="#18202A">필터 · 3개 결과</text><text id="t16" x="48" y="414" font-family="Noto Sans CJK KR, sans-serif" font-size="16" font-weight="400" fill="#505C69">범주</text><rect x="48" y="431" width="22" height="22" rx="3" fill="#145B8D" stroke="#145B8D"/><text id="t18" x="51" y="448" font-family="Noto Sans CJK KR, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">✓</text><text id="t19" x="83" y="450" font-family="Noto Sans CJK KR, sans-serif" font-size="18" font-weight="400" fill="#18202A">공간</text><rect x="48" y="475" width="22" height="22" rx="3" fill="#145B8D" stroke="#145B8D"/><text id="t21" x="51" y="492" font-family="Noto Sans CJK KR, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">✓</text><text id="t22" x="83" y="494" font-family="Noto Sans CJK KR, sans-serif" font-size="18" font-weight="400" fill="#18202A">프로그램</text><rect x="48" y="519" width="22" height="22" rx="3" fill="#FFFFFF" stroke="#145B8D"/><text id="t24" x="83" y="538" font-family="Noto Sans CJK KR, sans-serif" font-size="18" font-weight="400" fill="#18202A">장비</text><rect x="48" y="587" width="192" height="44" rx="6" fill="#145B8D"/><text id="t26" x="64" y="616.0" font-family="Noto Sans CJK KR, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">필터 적용</text><text id="t27" x="48" y="660" font-family="Noto Sans CJK KR, sans-serif" font-size="16" font-weight="400" fill="#145B8D">조건 모두 해제</text><rect x="288" y="341" width="704" height="112" rx="7" fill="#FFFFFF" stroke="#D5DDE4"/><text id="t29" x="304" y="373" font
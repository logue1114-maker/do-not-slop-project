<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790" viewBox="0 0 1600 790" role="img"><title>WCV2-05 넓은 헤더를 메시지 대신 가장 필요한 답에 쓴다</title><rect width="1600" height="790" fill="#EEF1F4"/><g font-family="Noto Sans CJK KR,sans-serif" fill="#17212B"><text x="24" y="44" font-size="25" font-weight="700">WCV2-05 넓은 헤더를 메시지 대신 가장 필요한 답에 쓴다</text><text x="24" y="76" font-size="18">같은 콘텐츠 · 같은 상태 · 1024×720 시안</text><text x="24" y="114" font-size="19" font-weight="700">수정 전</text><text x="816" y="114" font-size="19" font-weight="700">수정 후</text></g><g transform="translate(24,130) scale(.75)"><rect width="1024" height="720" fill="#FFFFFF"/><rect x="0" y="0" width="1024" height="64" rx="0" fill="#F5F7F9"/><text id="t1" x="32" y="41" font-family="Noto Sans CJK KR, sans-serif" font-size="20" font-weight="700" fill="#18202A">도서관 이용 안내</text><text id="t2" x="895" y="40" font-family="Noto Sans CJK KR, sans-serif" font-size="16" font-weight="400" fill="#18202A">도움</text><path d="M0,64 H1024" stroke="#D5DDE4"/><rect x="32" y="84" width="960" height="172" rx="8" fill="#E9F2F7"/><text id="t5" x="64" y="136" font-family="Noto Sans CJK KR, sans-serif" font-size="32" font-weight="600" fill="#18202A">더 나은 지식의 미래를 함께 열어갑니다</text><text id="t6" x="64" y="177" font-family="Noto Sans CJK KR, sans-serif" font-size="18" font-weight="400" fill="#505C69">아래에서 도서관의 다양한 서비스를 확인할 수 있습니다</text><text id="t7" x="64" y="209" font-family="Noto Sans CJK KR, sans-serif" font-size="16" font-weight="400" fill="#505C69">각 항목을 클릭하면 자세한 내용을 볼 수 있습니다</text><text id="t8" x="32" y="273" font-family="Noto Sans CJK KR, sans-serif" font-size="18" font-weight="400" fill="#18202A">10월 12일 시설 점검으로 휴관합니다. 외부 반납함은 이용 가능합니다.</text><rect x="32" y="324" width="960" height="58" rx="7" fill="#F6F8FA" stroke="#D5DDE4"/><text id="t10" x="50" y="347" font-family="Noto Sans CJK KR, sans-serif" font-size="20" font-weight="600" fill="#18202A">자료 이용</text><text id="t11" x="250" y="347" font-family="Noto Sans CJK KR, sans-serif" font-size="17" font-weight="400" fill="#505C69">책 빌리기와 반납 · 대출 기간 14일 · 연장 1회 가능</text><text id="t12" x="934" y="347" font-family="Noto Sans CJK KR, sans-serif" font-size="16" font-weight="400" fill="#145B8D">보기</text><rect x="32" y="389" width="960" height="58" rx="7" fill="#F6F8FA" stroke="#D5DDE4"/><text id="t14" x="50" y="412" font-family="Noto Sans CJK KR, sans-serif" font-size="20" font-weight="600" fill="#18202A">이용자 등록</text><text id="t15" x="250" y="412" font-family="Noto Sans CJK KR, sans-serif" font-size="17" font-weight="400" fill="#505C69">회원증 만들기 · 본인 확인 서류 필요 · 최초 발급 무료</text><text id="t16" x="934" y="412" font-family="Noto Sans CJK KR, sans-serif" font-size="16" font-weight="400" fill="#145B8D">보기</text><rect x="32" y="454" width="960" height="58" rx="7" fill="#F6F8FA" stroke="#D5DDE4"/><text id="t18" x="50" y="477" font-family="Noto Sans CJK KR, sans-serif" font-size="20" font-weight="600" fill="#18202A">열람 공간</text><text id="t19" x="250" y="477" font-family="Noto Sans CJK KR, sans-serif" font-size="17" font-weight="400" fill="#505C69">열람 좌석 예약 · 예약 시간 10분 경과 시 자동 취소</text><text id="t20" x="934" y="477" font-family="Noto Sans CJK KR, sans-serif" font-size="16" font-weight="400" fill="#145B8D">보기</text><rect x="32" y="519" width="960" height="58" rx="7" fill="#F6F8FA" stroke="#D5DDE4"/><text id="t22" x="50" y="542" font-family="Noto Sans CJK KR, sans-serif" font-size="20" font-weight="600" fill="#18202A">온라인 서비스</text><text id="t23" x="250" y="542" font-family="Noto Sans CJK KR, sans-serif" font-size="17" font-weight="400" fill="#505C69">전자책 이용 · 회원증 번호로 로그인</text><text id="t24" x="934" y="542" font-family="Noto Sans CJK KR, sans-serif" font-size="16" font-weight="400" fill="#145B8D">보기</text><rect x="32" y="584" width="960" height="58" rx="7" fill="#F6F8FA" stroke="#D5DDE4"/><text id="t26" x="50" y="607" font-family="Noto Sans CJK KR, sans-serif" font-size="20" font-weight="600" fill="#18202A">시설 지원</text><text id="t27" x="250" y="607" font-famil
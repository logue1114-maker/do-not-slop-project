<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; font-src 'self'; form-action 'none'; base-uri 'none'">
  <meta name="description" content="같은 예약 데이터로 화면 구조만 비교하는 가상 회의실 예약 변경 데모">
  <title>메이플 · 예약 시간 변경 비교</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="fixture.js"></script>
  <script defer src="model.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#screen">예약 변경 화면으로 이동</a>
  <header class="site-header">
    <a class="brand" href="?view=after&screen=selection" aria-label="메이플 회의실 데모 시작"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>MAPLE<span class="brand-sub">회의실 예약</span></span></a>
    <span class="demo-notice">가상 데모 · 실제 예약/결제 없음</span>
  </header>
  <section class="comparison-tools" aria-label="화면 비교 도구">
    <div class="tool-group"><span class="tool-label">화면 구조</span><div class="segmented" id="view-controls"><button type="button" data-view="before" aria-pressed="false">Before <span>의도적 결함</span></button><button type="button" data-view="after" aria-pressed="true">After <span>개선 제안</span></button><button type="button" data-view="compare" aria-pressed="false">나란히 비교</button></div></div>
    <div class="tool-group"><label class="tool-label" for="preset">같은 상태에서 비교</label><select id="preset"><option value="selection">01 · 시간 선택</option><option value="review">02 · 변경 확인</option><option value="conflict">03 · 가용성 충돌</option></select></div>
    <button class="text-button test-toggle" id="test-toggle" type="button" aria-expanded="false" aria-controls="test-panel">테스트 도구 <span aria-hidden="true">⌄</span></button>
  </section>
  <section class="test-panel" id="test-panel" hidden aria-label="로컬 검증 도구">
    <p>아래 도구는 로컬 메모리만 바꿉니다. 모든 금액·정책·결과는 가상입니다</p>
    <div class="test-actions"><label><input type="checkbox" id="stale-toggle"> 14:00 가용성 변경 시뮬레이션</label><label><input type="checkbox" id="slow-toggle"> 처리 지연 1.8초</label><button type="button" id="reset-test">fixture 초기화</button><button type="button" id="show-hashes">상태 SHA-256 확인</button></div>
    <p id="simulation-note" role="status"></p>
    <div id="hash-output" hidden></div>
    <p class="lab-footnote">동일 상태를 하나의 모델에서 렌더링 · 날짜/시간 변경은 확정 전 기존 예약에 반영되지 않음 · 새로고침 시 초기화</p>
  </section>
  <main id="screen" tabindex="-1"></main>
  <footer class="site-footer"><span>BKF4-F01 · 가상 비교 실험</span><span>Before는 의도적으로 만든 화면 · After는 설계 제안 · 사용성 실측 없음</span></footer>
  <div class="sr-only" role="status" aria-live="polite" id="live-status"></div>
</body>
</html>
